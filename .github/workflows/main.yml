    steps:
    - name: Download RDP Setup Files
      run: |
        Invoke-WebRequest -Uri "https://githubusercontent.com" -OutFile "BetterRDP.ps1"
        
    - name: Apply High-Performance Registry Tweaks
      run: |
        # Set RDP to 60 FPS and remove cursor delay
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "DWMFRAMEINTERVAL" -PropertyType DWord -Value 15 -Force
        New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\TermDD" -Name "InteractiveDelay" -PropertyType DWord -Value 0 -Force
        # Execute community performance script
        .\BetterRDP.ps1
        
    - name: Start Tunnel with Forced Low-Latency Region
      run: |
        # Replace 'us' with your closest region (eu, ap, au, sa, jp, in)
        .\ngrok.exe tcp --region in 3389

